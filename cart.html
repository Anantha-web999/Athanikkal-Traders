<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquiry List — Athanikkal Traders</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<header class="site-header" data-header></header>

<main class="section">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow" data-i18n="eyebrow_list"></span>
      <h2 data-i18n="enquiry_title"></h2>
      <p data-i18n="enquiry_sub"></p>
    </div>

    <div data-empty-state hidden>
      <div class="empty-msg">
        <h3 data-i18n="empty_title"></h3>
        <p data-i18n="empty_sub"></p>
        <a class="btn" href="products.html" data-i18n="empty_cta"></a>
      </div>
    </div>

    <div class="cart-layout" data-cart-layout hidden>
      <div>
        <div class="cart-items" data-cart-items></div>
        <p style="margin-top:14px">
          <button type="button" class="link-danger" data-clear data-i18n="clear_all"></button>
        </p>
      </div>

      <aside class="panel-sticky">
        <div class="panel">
          <h2 data-i18n="fulfil_title"></h2>
          <label class="opt">
            <input type="radio" name="fulfilment" value="delivery" checked>
            <span data-i18n="fulfil_delivery"></span>
          </label>
          <label class="opt">
            <input type="radio" name="fulfilment" value="pickup">
            <span data-i18n="fulfil_pickup"></span>
          </label>
        </div>

        <div class="panel">
          <h2 data-i18n="your_details"></h2>
          <p class="form-error" data-error hidden data-i18n="f_required"></p>

          <div class="field">
            <label for="f-name" data-i18n="f_name"></label>
            <input id="f-name" type="text" autocomplete="name">
          </div>
          <div class="field">
            <label for="f-phone" data-i18n="f_phone"></label>
            <input id="f-phone" type="tel" inputmode="tel" autocomplete="tel">
          </div>
          <div class="field" data-place-field>
            <label for="f-place" data-i18n="f_place"></label>
            <input id="f-place" type="text">
          </div>
          <div class="field">
            <label for="f-notes" data-i18n="f_notes"></label>
            <textarea id="f-notes"></textarea>
          </div>

          <button type="button" class="btn btn-wa btn-block" data-send-wa>
            <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2m5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.8-.6-3.1-1.3-5.1-4.4-5.3-4.6-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 .9c.2.1.4.2.4.3.1.1.1.6-.1 1.3"/></svg>
            <span data-i18n="send_wa"></span>
          </button>

          <a class="btn btn-ghost btn-block" style="margin-top:10px" href="tel:+919061541000">
            <span data-i18n="call_now"></span>
          </a>

          <p class="panel-note" data-i18n="order_note"></p>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer" data-footer></footer>

<script src="js/products.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const layout     = document.querySelector('[data-cart-layout]');
  const emptyState = document.querySelector('[data-empty-state]');
  const list       = document.querySelector('[data-cart-items]');
  const errorBox   = document.querySelector('[data-error]');
  const placeField = document.querySelector('[data-place-field]');

  function currentFulfilment() {
    return document.querySelector('input[name="fulfilment"]:checked').value;
  }

  function paint() {
    const items = readCart();
    const isEmpty = items.length === 0;
    layout.hidden = isEmpty;
    emptyState.hidden = !isEmpty;
    if (isEmpty) return;

    list.innerHTML = '';
    items.forEach(item => {
      const p = getProduct(item.id);
      if (!p) return;

      const row = document.createElement('div');
      row.className = 'cart-row';
      row.append(thumb(p));

      const info = document.createElement('div');
      const title = document.createElement('h3');
      title.textContent = [p.brand, tField(p)].filter(Boolean).join(' ');
      info.append(title);
      if (p.spec) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = p.spec;
        info.append(meta);
      }
      row.append(info);

      const controls = document.createElement('div');
      controls.className = 'cart-controls';

      const stepper = document.createElement('div');
      stepper.className = 'stepper';

      const minus = document.createElement('button');
      minus.type = 'button';
      minus.textContent = '−';
      minus.addEventListener('click', () => setQty(p.id, item.qty - 1));

      const input = document.createElement('input');
      input.type = 'number';
      input.min = '1';
      input.value = item.qty;
      input.addEventListener('change', () => {
        const n = parseInt(input.value, 10);
        setQty(p.id, Number.isFinite(n) && n > 0 ? n : 1);
      });

      const plus = document.createElement('button');
      plus.type = 'button';
      plus.textContent = '+';
      plus.addEventListener('click', () => setQty(p.id, item.qty + 1));

      stepper.append(minus, input, plus);

      const unit = document.createElement('div');
      unit.className = 'meta';
      unit.textContent = t('unit_' + p.unit);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'link-danger';
      remove.textContent = t('remove');
      remove.addEventListener('click', () => removeFromCart(p.id));

      controls.append(stepper, unit, remove);
      row.append(controls);
      list.append(row);
    });
  }

  function syncPlaceField() {
    placeField.hidden = currentFulfilment() === 'pickup';
  }

  document.querySelectorAll('input[name="fulfilment"]').forEach(radio => {
    radio.addEventListener('change', syncPlaceField);
  });

  document.querySelector('[data-clear]').addEventListener('click', clearCart);

  document.querySelector('[data-send-wa]').addEventListener('click', () => {
    const details = {
      fulfilment: currentFulfilment(),
      name:  document.getElementById('f-name').value.trim(),
      phone: document.getElementById('f-phone').value.trim(),
      place: document.getElementById('f-place').value.trim(),
      notes: document.getElementById('f-notes').value.trim()
    };

    if (!details.name || !details.phone) {
      errorBox.hidden = false;
      document.getElementById('f-name').focus();
      return;
    }
    errorBox.hidden = true;
    window.open(whatsappLink(details), '_blank', 'noopener');
  });

  document.addEventListener('cartchange', paint);
  document.addEventListener('langchange', paint);
  syncPlaceField();
  paint();
});
</script>
</body>
</html>
