<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('addr').innerHTML = SHOP.addressLines.join('<br>');

  const grid = document.querySelector('[data-cat-grid]');

  const paint = () => {
    grid.innerHTML = '';
    CATEGORIES.forEach((cat, i) => {
      const count = PRODUCTS.filter(p => p.cat === cat.id).length;
      const a = document.createElement('a');
      a.className = 'cat-tile';
      a.href = `products.html?cat=${cat.id}`;
      a.innerHTML = `<span class="idx">${String(i + 1).padStart(2, '0')}</span>
                     <span><h3>${tField(cat)}</h3>
                     <span class="count">${count} ${t('items_count')}</span></span>`;
      grid.append(a);
    });
  };

  document.addEventListener('langchange', paint);
  paint();
});
</script>
